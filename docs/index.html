<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>N-Body Universe</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #08131f;
        color: #eef6ff;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        width: min(720px, calc(100vw - 32px));
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2.2rem, 7vw, 5rem);
        line-height: 0.95;
      }

      p {
        color: #bad0e6;
        font-size: 1.05rem;
        line-height: 1.6;
      }

      a {
        color: #8fd3ff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>N-Body Universe</h1>
      <p>
        REBOUND + WASM + Three.js + Web Audio. The full interactive simulator is
        being published here from day one.
      </p>
      <p>
        Repository:
        <a href="https://github.com/baditaflorin/n-body-universe">https://github.com/baditaflorin/n-body-universe</a>
      </p>
      <p>
        Support:
        <a href="https://www.paypal.com/paypalme/florinbadita">https://www.paypal.com/paypalme/florinbadita</a>
      </p>
    </main>
  </body>
</html>
